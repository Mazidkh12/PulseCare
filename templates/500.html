<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Server Error (500) - PulseCare Clinic</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <style>
        body {
            background-color: #f8f9fa;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .error-card {
            background: #ffffff;
            border: 1px solid #dee2e6;
            border-radius: 12px;
            padding: 40px;
            max-width: 580px;
            text-align: center;
            box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.05);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <div class="text-danger display-1 mb-3">
            <i class="bi bi-exclamation-octagon"></i>
        </div>
        <h2 class="fw-bold text-dark mb-2">Unexpected Server Error</h2>
        <div class="badge bg-danger-subtle text-danger border border-danger-subtle px-3 py-2 mb-3">
            HTTP 500 Internal Server Error
        </div>
        <p class="text-muted mb-4">
            An internal system exception occurred while processing your request.
            Technical telemetry has been isolated and logged. To protect patient data and system confidentiality, technical stack traces are not displayed.
        </p>
        <div class="d-flex justify-content-center gap-2">
            <a href="/" class="btn btn-primary">
                <i class="bi bi-house me-1"></i> Return to Clinic Portal
            </a>
            <button onclick="window.location.reload()" class="btn btn-outline-secondary">
                <i class="bi bi-arrow-clockwise me-1"></i> Retry
            </button>
        </div>
    </div>
</body>
</html>
